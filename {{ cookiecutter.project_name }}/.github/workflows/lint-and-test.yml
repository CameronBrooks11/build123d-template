# .github/workflows/lint-and-test.yml

name: Lint, Type Check, and Run Python Code

on:
  workflow_dispatch:
  push:

jobs:
  lint-with-ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned, not "3.x". build123d/OCP need wheels for a new interpreter,
          # and "3.x" follows each Python release the day it lands — before
          # those wheels exist. 3.12 sits inside build123d's >=3.10,<3.15 window.
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check .

  check-with-pyright:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned, not "3.x". build123d/OCP need wheels for a new interpreter,
          # and "3.x" follows each Python release the day it lands — before
          # those wheels exist. 3.12 sits inside build123d's >=3.10,<3.15 window.
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Install pyright
        run: pip install pyright

      - name: Run pyright
        run: pyright .

  run-python-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned, not "3.x". build123d/OCP need wheels for a new interpreter,
          # and "3.x" follows each Python release the day it lands — before
          # those wheels exist. 3.12 sits inside build123d's >=3.10,<3.15 window.
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run Python scripts in package folder
        run: |
          find {{ cookiecutter.package_name }} -name "*.py" | while read file; do
            echo "Running $file"
            python "$file"
          done
