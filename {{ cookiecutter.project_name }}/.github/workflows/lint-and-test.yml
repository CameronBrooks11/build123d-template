# Runs the justfile's recipes, so CI and a local `just check` are the same gate.

name: Lint, Type Check, and Run Python Code

on:
  workflow_dispatch:
  push:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned, not "3.x". build123d/OCP need wheels for a new interpreter,
          # and "3.x" follows each Python release the day it lands, before
          # those wheels exist. 3.12 sits inside requires-python.
          python-version: "3.12"

      - name: Install the project and its dev tools
        run: just setup

      - name: Format check, lint and type check
        run: just check

  parts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install the project
        run: just setup

      - name: Run every module in the package
        run: just parts
