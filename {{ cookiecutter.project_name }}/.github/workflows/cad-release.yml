# .github/workflows/cad-release.yml

name: Lint, Run Scripts, and Publish Release on Tag

# Tags only: a manual run would take the branch name as the release tag.
on:
  push:
    tags:
      - "v*"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned, as in lint-and-test.yml.
          python-version: "3.12"

      - name: Install the project and its dev tools
        run: just setup

      - name: Format check, lint and type check
        run: just check

      - name: Build the parts into build/
        run: just parts

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ '{{' }} secrets.GITHUB_TOKEN {{ '}}' }}
          tag: ${{ '{{' }} github.ref_name {{ '}}' }}
          name: "Release ${{ '{{' }} github.ref_name {{ '}}' }}"
          draft: false
          prerelease: false

      - name: Upload build products to release
        if: success()
        run: |
          echo "Uploading build products to release for ${{ '{{' }} github.ref_name {{ '}}' }}"
          for file in build/*; do
            new_file=$(echo $file | sed "s/\(.*\)\.\(.*\)/\1-${{ '{{' }} github.ref_name {{ '}}' }}.\2/")
            echo "Uploading $file as $new_file"
            mv $file $new_file
            gh release upload ${{ '{{' }} github.ref_name {{ '}}' }} "$new_file"
          done
        env:
          GITHUB_TOKEN: ${{ '{{' }} secrets.GITHUB_TOKEN {{ '}}' }}
